[azure]
project_endpoint = {project_endpoint}
model_deployment_name = {model_deployment_name}
key =
endpoint =
apiversion = 2024-08-01-preview
deploymentname = gpt-5.4

[deployment]
# Target runtime hosting mode used by main.py server mode.
# foundry -> ResponsesHostServer (Foundry adapter)
# aca     -> MCP -> A2A -> Agent Framework server
targetDeployment = {targetdeployment}

[observability]
enabled = false
# Comma-separated backends to load. Supported: langfuse
providers = langfuse
service_name = orchestrator

[observability.langfuse]
enabled = false
public_key = 
secret_key = 
host = 

[mcp]
# FastMCP + A2A server settings (active when targetDeployment = aca).
# All values can be overridden by env vars: PORT, MCP_PATH, A2A_PATH,
# HOST, TARGET_DEPLOYMENT.
#
# application_suffix: URL prefix when the container sits behind an API gateway
# that routes to a sub-path (e.g. /myagent).  Leave empty for direct ACA /
# Cloud Run deployments with no path prefix — the MCP endpoint is then served
# directly at /mcp and the A2A endpoint at /a2a.
application_suffix =

[auth.keycloak]
# Keycloak OAuth + JWT auth for the FastMCP /mcp endpoint (aca hosting mode).
# The {placeholders} are intentionally left unresolved so keycloak_auth.py falls
# back to the KEYCLOAK_* environment variables the deployer injects at run time.
# For a local run, set KEYCLOAK_AUTH_ENABLED=false to skip auth entirely.
# If auth is enabled but required values are unresolved the server starts in
# fail-closed mode (every request returns 503).
#
# Required env vars when auth is enabled:
#   KEYCLOAK_AUTH_ENABLED=true
#   KEYCLOAK_URL=https://<keycloak-host>
#   KEYCLOAK_REALM=<realm>
#   KEYCLOAK_CLIENT_ID=<client-id>
#   KEYCLOAK_CLIENT_SECRET=<client-secret>
#   MCP_BASE_URL=https://<public-domain-of-this-service>  (OAuthProxy base URL)
isauthenabled = {keycloak_authenabled}
url = {keycloak_url}
realm = {keycloak_realm}
client_id = {keycloak_client_id}
client_secret = {keycloak_client_secret}
# Public base URL of this server (used by the FastMCP OAuthProxy browser-login
# flow). Injected via the MCP_BASE_URL env var after the ACA service URL is
# known (gcloud run services update --update-env-vars MCP_BASE_URL=...).
domain = {keycloak_domain}

[secrets_fallback]
# Fallback values for any secret store key. Keys must match the exact name used
# in the secret store (e.g. langfuse-publickey, oai-1-key1). Only applied when
# the key is missing or empty in the secret store response.
# langfuse-publickey =
# langfuse-secretkey =
